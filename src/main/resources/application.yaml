server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: Foco_Nos_Estudos_Spring_boot

  datasource:
    url: jdbc:mysql://localhost:3306/focoestudos?allowPublicKeyRetrieval=true&sslMode=DISABLED&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-troque-em-producao-0123456789}
    expiracao-segundos: 3600

  cors:
    allowed-origins: http://localhost:3000, http://localhost:5173
