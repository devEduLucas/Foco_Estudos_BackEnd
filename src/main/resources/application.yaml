server:
  port: 8080

spring:
  application:
    name: Foco_Nos_Estudos_Spring_boot

  datasource:
    url: "{DB_URL}"
    username: "{DB_USERNAME}"
    password: "{DB_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-troque-em-producao-0123456789}
    expiracao-segundos: 3600

  cors:
    allowed-origins: http://localhost:3000, http://localhost:5173